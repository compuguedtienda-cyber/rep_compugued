<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f24">

  <title>COMPUGUED | Tecnología</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" href="img/iconos/logoico.ico">

</head>

<body>

<div class="phone">
<div class="contorno">

  <!-- TOP BAR -->
  <div class="top-bar">

    <div class="weather-wrap">
      <div class="weather">
        <i class="fa-solid fa-temperature-empty"></i>
        <span class="temp">-- °C</span>
      </div>
      <div class="city">Chiclayo</div>
    </div>

    <div class="share-buttons">
      <button class="icon-btn" onclick="sharePage()">
        <i class="fa-solid fa-arrows-rotate"></i>
      </button>
    </div>

  </div>

  <!-- HEADER -->
  <div class="header">
    <img src="img/logo/logofondoazul.png" class="avatar">
    <h1>COMPUGUED</h1>
    <p>Asesoría y Venta de Computadoras, Laptops, Impresoras y Accesorios Tecnológicos</p>
  </div>

  <!-- SLIDER -->
  <div class="container">
    <div class="slider">
      <button class="nav prev">&#10094;</button>

      <div class="slider-window">
        <div class="slider-track">
          <img src="img/slider/1.jpg">
          <img src="img/slider/2.jpg">
          <img src="img/slider/3.jpg">
          <img src="img/slider/4.jpg">
          <img src="img/slider/5.jpg">
        </div>
      </div>

      <button class="nav next">&#10095;</button>
    </div>
  </div>

  <!-- BOTONES -->
  <div class="actions">
    <a href="catalogo.pdf" class="action btn">
      <i class="fa-solid fa-download"></i>
      <span>Catálogo PDF</span>
    </a>

    <a href="https://wa.me/51926845127" class="action">
      <i class="fa-brands fa-whatsapp"></i>
      <span>926 845 127</span>
    </a>
  </div>

  <!-- REDES -->
  <div class="share-buttons2">
    <button class="icon-btn" onclick="goToFace()">
      <i class="fa-brands fa-facebook"></i>
    </button>
    <button class="icon-btn" onclick="goToInst()">
      <i class="fa-brands fa-instagram"></i>
    </button>
    <button class="icon-btn" onclick="goToMap()">
      <i class="fa-solid fa-location-dot"></i>
    </button>
  </div>

</div>
</div>

<script src="js/app.js"></script>

</body>
</html>
